name: Build Android Release APK (no assets)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'dist/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;29.0.14206865"

      # ---------- 资源：只建占位目录，不导入任何真实资源 ----------
      # build_apk.py 会读 runtime/assets 生成 mcassets.list；
      # 这里给一个空目录，让脚本能跑通并产出不含资源的 APK。
      - name: Create placeholder assets dir
        run: mkdir -p runtime/assets/minecraft

      # 注意：SPIR-V 着色器默认已入库。
      # 若你的仓库没有 src/vulkan/shaders/spv/*.spv，CI 会编译失败，
      # 请在本地 Windows 跑一次 spv-precompiler 并提交产物。

      - name: Build cdylib for Android
        run: cargo ndk -t arm64-v8a --platform 31 -o target/android build --release --lib
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: python tools/build_apk.py

      - name: Verify APK
        run: |
          ls -lh dist/
          test -f dist/Minecraft112Rust.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft112Rust-noassets-${{ github.sha }}
          path: dist/Minecraft112Rust.apk
          retention-days: 30
